name: "Publish NewPipe Perle APK"

# Every push to the perle branch publishes a GitHub Release tagged perle-v<run number>,
# after running the same checks as the CI. Pushing a perle-v* tag publishes that tag.
on:
  push:
    branches:
      - perle
    tags:
      - 'perle-v*'
    paths-ignore:
      - 'README.md'
      - 'doc/**'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # needed to create the release

    env:
      PERLE_DEBUG_KEYSTORE: ${{ secrets.PERLE_DEBUG_KEYSTORE }}

    steps:
      - uses: actions/checkout@v6

      # the app id and name are derived from the branch name:
      # `perle` gives `org.schabi.newpipe.continuous.perle` and "NewPipe Perle"
      - name: create and checkout perle branch
        run: git checkout -B perle

      - name: set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      # A stable signing key, so that new versions install over the old ones and keep their
      # data. The key in .github/perle is used unless the PERLE_DEBUG_KEYSTORE secret
      # (a base64 encoded keystore with alias androiddebugkey and password android) is set.
      - name: restore signing key
        run: |
          mkdir -p ~/.android
          if [ -n "$PERLE_DEBUG_KEYSTORE" ]; then
            echo "$PERLE_DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
          else
            cp .github/perle/perle-signing.keystore ~/.android/debug.keystore
          fi

      # testDebugUnitTest also runs checkstyle and ktlint
      - name: Build APK and run checks
        run: ./gradlew assembleContinuous testDebugUnitTest --stacktrace -DskipFormatKtlint "-DversionNameSuffix=-perle${{ github.run_number }}"

      - name: Rename APK
        run: |
          # assume there is only one APK in that folder
          mv app/build/outputs/apk/continuous/*.apk app/build/outputs/apk/continuous/NewPipe-Perle.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('perle-v{0}', github.run_number) }}
        run: |
          gh release create "$TAG" app/build/outputs/apk/continuous/NewPipe-Perle.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NewPipe Perle ($TAG)" \
            --notes-file .github/perle/RELEASE_NOTES.md \
            --latest
